name: Build Debug & Release

on:
  push:
    branches: [ devel ]
  pull_request:
    branches: [ devel ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
        else
          echo "No keystore found, creating debug keystore"
          keytool -genkey -v -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password -keypass password \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"
        fi
    
    # 同时构建 Release + Debug
    - name: Build Release & Debug APK
      run: |
        ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace \
          -PRELEASE_STORE_FILE=../release.keystore \
          -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD || 'password' }}" \
          -PRELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS || 'release' }}" \
          -PRELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD || 'password' }}"
    
    - name: Get version info
      id: version
      run: |
        VERSION_NAME=$(./gradlew -q printVersionName --no-daemon | tail -n 1)
        VERSION_CODE=$(./gradlew -q printVersionCode --no-daemon | tail -n 1)
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "Version: $VERSION_NAME ($VERSION_CODE)"
    
    - name: List all build outputs
      run: |
        echo "=== Release APKs ==="
        find app/build/outputs/apk/release -name "*.apk" -type f
        echo -e "\n=== Debug APKs ==="
        find app/build/outputs/apk/debug -name "*.apk" -type f
    
    - name: Collect all APKs
      run: |
        mkdir -p build-outputs
        # 复制 Release & Debug APK
        cp -r app/build/outputs/apk/release/*.apk build-outputs/
        cp -r app/build/outputs/apk/debug/*.apk build-outputs/
    
    # 上传到 GitHub Action 附件（不上传 Release）
    - name: Upload APKs to Action Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kototoro-apks-${{ steps.version.outputs.version_name }}
        path: build-outputs/*.apk
        if-no-files-found: error
